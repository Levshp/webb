name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/levshp/webb:latest \
            -t ghcr.io/levshp/webb:${{ github.sha }} \
            .

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/levshp/webb:latest
          docker push ghcr.io/levshp/webb:${{ github.sha }}

      - name: Prepare static files for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          rsync -av --exclude='.git' --exclude='.github' --exclude='Dockerfile' --exclude='docker-compose*' --exclude='README.md' --exclude='LICENSE' --exclude='dist' ./ dist/

      - name: Deploy website via SFTP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SFTP_PASS != ''
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        env:
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        with:
          username: ${{ secrets.SFTP_USER }}
          server: ${{ secrets.SFTP_HOST }}
          port: 2222
          password: ${{ secrets.SFTP_PASS }}
          local_path: 'dist/'
          remote_path: '/'
          sftp_only: true
          delete_remote_files: false
          sftpArgs: '-o HostKeyAlgorithms=+ssh-rsa'


